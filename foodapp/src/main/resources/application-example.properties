# ========================================================
# Food Delivery Super Admin - Example Backend Configuration
# Copy this file to application.properties and update values
# ========================================================

spring.application.name=FoodApp-SwiggyBackend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/swiggy_foodapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Authentication
jwt.secret=${JWT_SECRET:YOUR_SECURE_JWT_SECRET_KEY_MINIMUM_256_BITS}
jwt.expiration=86400000

# Razorpay Configuration (Sandbox / Production)
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# Stripe Configuration (Test / Live)
stripe.api_key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook_secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.currency=usd

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.swiggy.foodapp=DEBUG
