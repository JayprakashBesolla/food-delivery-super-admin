spring.application.name=FoodApp-SwiggyBackend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/swiggy_foodapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=swiggy-secret-key-super-secure-production-ready-foodapp-jwt-secret-key-123456789
jwt.expiration=86400000

# Razorpay Configuration (Optional default test keys)
razorpay.key_id=rzp_test_placeholder
razorpay.key_secret=rzp_secret_placeholder

# Stripe Configuration (Optional default test keys)
stripe.api_key=sk_test_placeholder
stripe.webhook_secret=whsec_placeholder
stripe.currency=usd

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.swiggy.foodapp=DEBUG
 